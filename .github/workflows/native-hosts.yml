name: Native host compatibility

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.6"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            compstagram/package-lock.json
            turtle/package-lock.json

      - name: Exercise native bootstrap workflow
        if: matrix.python-version == '3.12'
        run: python scripts/bootstrap.py

      - name: Synchronize Python package and development tools
        run: uv sync --project server --locked --python ${{ matrix.python-version }}

      - name: Install browser client
        working-directory: client
        run: npm ci

      - name: Type-check browser client
        working-directory: client
        run: npm run typecheck

      - name: Test browser client
        if: matrix.python-version == '3.12'
        working-directory: client
        run: npm test

      - name: Build browser client into Python package
        working-directory: client
        run: npm run build

      - name: Build optional browser templates
        if: matrix.python-version == '3.12'
        run: |
          npm ci --prefix compstagram
          npm run build --prefix compstagram
          npm ci --prefix turtle
          npm run build --prefix turtle

      - name: Run Python test suite
        run: >-
          uv run --project server --locked --no-sync python -m pytest server/tests

      - name: Check installed dependencies and CLI
        run: uv pip check --project server

      - name: Check module entry point
        run: uv run --project server --locked --no-sync trailhead --help

      - name: Type-check Python package
        run: >-
          uv run --project server --locked --no-sync mypy
          --config-file server/pyproject.toml
          server/src server/tests scripts bin/build-trailhead

      - name: Check Python formatting
        run: >-
          uv run --project server --locked --no-sync ruff format --check
          server/src server/tests scripts bin/build-trailhead

      - name: Exercise portable unpacked build
        run: uv run --project server --locked --no-sync python bin/build-trailhead

      - name: Build wheel and source archive
        run: uv build server --out-dir artifacts

      - name: Verify build archives
        run: >-
          uv run --project server --locked --no-sync python
          server/tests/verify_distribution.py artifacts
