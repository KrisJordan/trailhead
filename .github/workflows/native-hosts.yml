name: Native host compatibility

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            compstagram/package-lock.json
            turtle/package-lock.json

      - name: Exercise native bootstrap workflow
        if: matrix.python-version == '3.12'
        run: python scripts/bootstrap.py

      - name: Install Python package and test tools
        run: python -m pip install --editable "server[dev]"

      - name: Install browser client
        working-directory: client
        run: npm ci

      - name: Type-check browser client
        working-directory: client
        run: npm run typecheck

      - name: Build browser client into Python package
        working-directory: client
        run: npm run build

      - name: Build optional browser templates
        if: matrix.python-version == '3.12'
        run: |
          npm ci --prefix compstagram
          npm run build --prefix compstagram
          npm ci --prefix turtle
          npm run build --prefix turtle

      - name: Run Python test suite
        run: python -m pytest server/tests

      - name: Check installed dependencies and CLI
        run: python -m pip check

      - name: Check module entry point
        run: python -m trailhead --help

      - name: Type-check Python package
        run: >-
          python -m mypy --config-file server/pyproject.toml
          server/src server/tests scripts bin/build-trailhead

      - name: Exercise portable unpacked build
        run: python bin/build-trailhead

      - name: Build wheel and source archive
        run: python -m build server --outdir artifacts

      - name: Verify build archives
        run: python server/tests/verify_distribution.py artifacts
