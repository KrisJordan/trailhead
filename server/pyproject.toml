[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trailhead-edu"
version = "0.2.2"
description = "A local web environment for learning and exploring Python programs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kris Jordan", email = "kris@cs.unc.edu" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cachetools>=5.3,<7",
    "fastapi>=0.108,<1",
    "pydantic>=2.5,<3",
    "uvicorn>=0.25,<1",
    "watchdog>=3,<7",
    "websockets>=12,<17",
]

[project.optional-dependencies]
student = [
    "ipykernel>=6.28",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.1",
    "seaborn>=0.13",
    "six>=1.16",
    "svgwrite>=1.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-json-report>=1.5",
    "ruff>=0.9",
    "types-cachetools>=5.3",
]

[project.scripts]
trailhead = "trailhead.__main__:main"

[project.urls]
Homepage = "https://github.com/KrisJordan/trailhead"
Issues = "https://github.com/KrisJordan/trailhead/issues"
Repository = "https://github.com/KrisJordan/trailhead.git"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["trailhead*"]

[tool.setuptools.package-data]
trailhead = [
    "static/*",
    "static/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
